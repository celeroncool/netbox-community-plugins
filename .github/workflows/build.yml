name: Build custom NetBox image

on:
  workflow_dispatch:
    inputs:
      netbox_version:
        description: "NetBox tag, e.g. v4.7.2 (empty = versions.env)"
        required: false
      netbox_docker_version:
        description: "netbox-docker version, e.g. 5.1.1 (empty = versions.env)"
        required: false
      platforms:
        description: "Build platforms"
        required: false
        default: linux/amd64
  push:
    branches: [main]
    paths: [versions.env, Dockerfile-Plugins, plugin_requirements.txt, configuration/**]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout (custom plugins)
        uses: actions/checkout@v7

      - name: Resolve versions
        id: ver
        env:
          IN_NB: ${{ inputs.netbox_version }}
          IN_ND: ${{ inputs.netbox_docker_version }}
          IN_PL: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          source versions.env
          nb="${IN_NB:-$NETBOX_VERSION}"
          nd="${IN_ND:-$NETBOX_DOCKER_VERSION}"
          [[ "$nb" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid NetBox version: $nb"; exit 1; }
          [[ "$nd" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]  || { echo "Invalid netbox-docker version: $nd"; exit 1; }
          {
            echo "tag=$nb-$nd"
            echo "platforms=${IN_PL:-linux/amd64}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=${{ steps.ver.outputs.tag }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ steps.ver.outputs.tag }}-

      - name: Build & push plugin image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile-Plugins
          build-args: BASE=docker.io/netboxcommunity/netbox:${{ steps.ver.outputs.tag }}
          platforms: ${{ steps.ver.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
