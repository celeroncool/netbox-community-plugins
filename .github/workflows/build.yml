name: Build custom NetBox image

on:
  workflow_dispatch:
    inputs:
      netbox_version:
        description: "NetBox tag, e.g. v4.6.0 (empty = versions.env)"
        required: false
      netbox_docker_version:
        description: "netbox-docker tag, e.g. 5.0.2 (empty = versions.env)"
        required: false
  push:
    branches: [main]
    paths: [versions.env, Dockerfile-Plugins, plugin_requirements.txt, configuration/**]
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild of the pinned pair (OS/base patches)

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (custom plugins)
        uses: actions/checkout@v4

      - name: Resolve versions
        id: ver
        env:
          IN_NB: ${{ inputs.netbox_version }}
          IN_ND: ${{ inputs.netbox_docker_version }}
        run: |
          set -euo pipefail
          source versions.env
          nb="${IN_NB:-$NETBOX_VERSION}"
          nd="${IN_ND:-$NETBOX_DOCKER_VERSION}"
          [[ "$nb" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid NetBox version: $nb"; exit 1; }
          [[ "$nd" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]  || { echo "Invalid netbox-docker version: $nd"; exit 1; }
          echo "netbox=$nb"        >> "$GITHUB_OUTPUT"
          echo "netbox_docker=$nd" >> "$GITHUB_OUTPUT"

      - name: Checkout netbox-docker (pinned tag)
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox-docker
          ref: ${{ steps.ver.outputs.netbox_docker }}
          path: netbox-docker

      - name: Build base image
        working-directory: netbox-docker
        env:
          IMAGE_NAMES: netbox-base
          TAG: base
        run: |
          ./build.sh "${{ steps.ver.outputs.netbox }}"
          docker image inspect netbox-base:base >/dev/null

      - name: Inject custom plugin files
        run: |
          cp Dockerfile-Plugins plugin_requirements.txt netbox-docker/
          cp configuration/plugins.py netbox-docker/configuration/plugins.py

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.netbox }}-${{ steps.ver.outputs.netbox_docker }}
            type=raw,value=${{ steps.ver.outputs.netbox }}-${{ steps.ver.outputs.netbox_docker }}-{{date 'YYYYMMDD'}}
            type=sha,prefix=${{ steps.ver.outputs.netbox }}-${{ steps.ver.outputs.netbox_docker }}-

      - name: Build & push plugin image
        uses: docker/build-push-action@v6
        with:
          context: netbox-docker
          file: netbox-docker/Dockerfile-Plugins
          build-args: BASE=netbox-base:base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
